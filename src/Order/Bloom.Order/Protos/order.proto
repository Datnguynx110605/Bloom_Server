syntax = "proto3";

package bloom.order.v1;

import "google/api/annotations.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Bloom.Order.Api";

// 03-order §9: the address of a checkout. The services of 03-order §5.1 join this file in their own tasks.
message ShipTo {
  string name = 1;
  repeated string lines = 2;
  string city = 3;
  string state = 4;
  string zip = 5;
  string phone = 6;
}

// 03-order §5.1, Cart API: customers only, transcoded to JSON under /api/cart (spec §6).
service OrderCart {
  // No cart is version 0 with no lines. Each line carries its current catalog price and flags (spec §4).
  rpc GetCart(GetCartRequest) returns (Cart) {
    option (google.api.http) = { get: "/api/cart" };
  }

  // `quantity` is absolute; 0 removes the line and, for a device, its plan lines. `version` must be the cart's (0 for no cart).
  rpc UpsertCartLine(UpsertCartLineRequest) returns (Cart) {
    option (google.api.http) = { put: "/api/cart/lines" body: "*" };
  }

  // A device line takes its plan lines with it. `version` travels as a query parameter.
  rpc RemoveCartLine(RemoveCartLineRequest) returns (Cart) {
    option (google.api.http) = { delete: "/api/cart/lines/{line_no}" };
  }
}

message GetCartRequest {}

message UpsertCartLineRequest {
  string kind = 1; // product | warranty_plan
  string sku_id = 2;
  optional int32 parent_line_no = 3; // plans only: the device line
  int32 quantity = 4;
  int64 version = 5;
}

message RemoveCartLineRequest {
  int32 line_no = 1;
  int64 version = 2;
}

message Cart {
  int64 version = 1;
  repeated CartLine lines = 2;
}

message CartLine {
  int32 line_no = 1;
  string kind = 2;
  string sku_id = 3;
  optional int32 parent_line_no = 4;
  int32 quantity = 5;
  string name = 6;
  optional int64 price_cents = 7; // current catalog price
  bool available = 8; // catalog `buyable`
  optional bool out_of_stock = 9; // product lines only; absent when inventory is unreachable
}

// 03-order §5.1, staff API: coupons (catalog manager, admin) under /api/admin/coupons and checkout settings (admin) under /api/admin/settings (spec §6).
service OrderStaff {
  // Newest first; `active` filters. `page` from 1 (0 is 1), `page_size` 1-100 (0 is 50).
  rpc ListCoupons(ListCouponsRequest) returns (ListCouponsResponse) {
    option (google.api.http) = { get: "/api/admin/coupons" };
  }

  // A code that exists ignoring case is COUPON_CODE_TAKEN.
  rpc CreateCoupon(CreateCouponRequest) returns (Coupon) {
    option (google.api.http) = { post: "/api/admin/coupons" body: "*" };
  }

  // Replaces every field but the code, and the scope items. Versioned; inactive coupons stay inactive.
  rpc UpdateCoupon(UpdateCouponRequest) returns (Coupon) {
    option (google.api.http) = { put: "/api/admin/coupons/{coupon_id}" body: "*" };
  }

  // Versioned (PRM-R13). An inactive coupon stays inactive.
  rpc DeactivateCoupon(DeactivateCouponRequest) returns (Coupon) {
    option (google.api.http) = { post: "/api/admin/coupons/{coupon_id}/deactivate" body: "*" };
  }

  // Any order, any status. 03-order §5.1.
  rpc GetOrder(GetOrderRequest) returns (Order) {
    option (google.api.http) = { get: "/api/admin/orders/{order_id}" };
  }

  // Newest first; `number`, `account_id` and `status` filter in any combination. `page` from 1 (0 is 1), `page_size` 1-100 (0 is 50).
  rpc SearchOrders(SearchOrdersRequest) returns (ListOrdersResponse) {
    option (google.api.http) = { get: "/api/admin/orders" };
  }

  // `paid`, `awaiting_stock` or `packing` (ORD-R14). Versioned; audited.
  rpc SupportCancelOrder(SupportCancelOrderRequest) returns (Order) {
    option (google.api.http) = { post: "/api/admin/orders/{order_id}/cancel" body: "*" };
  }

  rpc GetCheckoutSettings(GetCheckoutSettingsRequest) returns (CheckoutSettings) {
    option (google.api.http) = { get: "/api/admin/settings/checkout" };
  }

  // Versioned; `version` is the settings' (0 until the first change).
  rpc SetExpressFee(SetExpressFeeRequest) returns (CheckoutSettings) {
    option (google.api.http) = { put: "/api/admin/settings/checkout/express-fee" body: "*" };
  }
}

message ScopeItem {
  string target_type = 1; // product | category
  string target_id = 2;
}

message Coupon {
  string id = 1;
  string code = 2; // as entered
  string type = 3; // percent | fixed
  int32 value = 4; // percent 1-100, fixed cents > 0
  string scope = 5; // order | selected
  repeated ScopeItem scope_items = 6;
  optional int64 min_spend_cents = 7;
  google.protobuf.Timestamp starts_at = 8;
  google.protobuf.Timestamp expires_at = 9;
  optional int32 total_limit = 10;
  optional int32 per_customer_limit = 11;
  int32 uses_count = 12;
  bool active = 13;
  int64 version = 14;
  google.protobuf.Timestamp created_at = 15;
}

message CreateCouponRequest {
  string code = 1;
  string type = 2;
  int32 value = 3;
  string scope = 4;
  repeated ScopeItem scope_items = 5;
  optional int64 min_spend_cents = 6;
  google.protobuf.Timestamp starts_at = 7;
  google.protobuf.Timestamp expires_at = 8;
  optional int32 total_limit = 9;
  optional int32 per_customer_limit = 10;
}

message UpdateCouponRequest {
  string coupon_id = 1;
  int64 version = 2;
  string type = 3;
  int32 value = 4;
  string scope = 5;
  repeated ScopeItem scope_items = 6;
  optional int64 min_spend_cents = 7;
  google.protobuf.Timestamp starts_at = 8;
  google.protobuf.Timestamp expires_at = 9;
  optional int32 total_limit = 10;
  optional int32 per_customer_limit = 11;
}

message DeactivateCouponRequest {
  string coupon_id = 1;
  int64 version = 2;
}

message ListCouponsRequest {
  optional bool active = 1;
  int32 page = 2;
  int32 page_size = 3;
}

message ListCouponsResponse {
  repeated Coupon items = 1;
}

message CheckoutSettings {
  int64 express_fee_cents = 1;
  int64 version = 2;
  string updated_by = 3;
  google.protobuf.Timestamp updated_at = 4;
}

message GetCheckoutSettingsRequest {}

message SetExpressFeeRequest {
  int64 express_fee_cents = 1;
  int64 version = 2;
}

// 03-order §5.1, Checkout API: customers only, transcoded to JSON under /api/checkout (spec §6). The `Idempotency-Key` header is required.
service OrderCheckout {
  // Prices the cart (or the launch lines), holds the stock, locks the prices and opens the payment. A retry with the same key resumes the same order.
  rpc StartCheckout(StartCheckoutRequest) returns (StartCheckoutResponse) {
    option (google.api.http) = { post: "/api/checkout" body: "*" };
  }
}

message StartCheckoutRequest {
  oneof source {
    CartSource cart = 1;
    LaunchSource launch = 2;
  }
  ShipTo ship_to = 3;
  string shipping_option = 4; // standard | express
  optional string coupon_code = 5;
}

// The caller's own cart.
message CartSource {}

message LaunchSource {
  string launch_id = 1;
  string pass_token = 2;
  repeated CheckoutLine lines = 3;
}

message CheckoutLine {
  string kind = 1; // product | warranty_plan
  string sku_id = 2;
  int32 quantity = 3;
  optional int32 parent_line_no = 4; // plans only: the 1-based position of the device in `lines`
}

message StartCheckoutResponse {
  string order_id = 1;
  string number = 2;
  int64 subtotal_cents = 3;
  int64 discount_cents = 4;
  int64 tax_cents = 5;
  int64 shipping_cents = 6;
  int64 total_cents = 7;
  string payment_url = 8;
  google.protobuf.Timestamp deadline_at = 9;
}

// 03-order §5.1, Order API: customers only, transcoded to JSON under /api/orders (spec §6). Another customer's order, and any `creating` one, is NOT_FOUND.
service OrderCustomer {
  // Newest first, never `creating`. `page` from 1 (0 is 1), `page_size` 1-100 (0 is 50).
  rpc ListMyOrders(ListMyOrdersRequest) returns (ListOrdersResponse) {
    option (google.api.http) = { get: "/api/orders" };
  }

  rpc GetOrder(GetOrderRequest) returns (Order) {
    option (google.api.http) = { get: "/api/orders/{order_id}" };
  }

  // `paid` or `awaiting_stock`, and only while fulfillment has not started packing (ORD-R05). Versioned.
  rpc CancelOrder(CancelOrderRequest) returns (Order) {
    option (google.api.http) = { post: "/api/orders/{order_id}/cancel" body: "*" };
  }
}

message Order {
  string id = 1;
  string number = 2;
  string account_id = 3;
  string kind = 4; // regular | launch
  string launch_id = 5; // launch orders only
  string status = 6;
  string cancel_reason = 7; // cancelled orders only
  ShipTo ship_to = 8;
  string shipping_option = 9;
  string currency = 10;
  int64 subtotal_cents = 11;
  int64 discount_cents = 12;
  int64 tax_cents = 13;
  int64 shipping_cents = 14;
  int64 total_cents = 15;
  int32 tax_rate_bp = 16;
  google.protobuf.Timestamp deadline_at = 17;
  google.protobuf.Timestamp delivered_at = 18;
  int64 version = 19;
  google.protobuf.Timestamp created_at = 20;
  repeated OrderLine lines = 21;
  repeated StatusChange history = 22;
}

message OrderLine {
  int32 line_no = 1;
  string kind = 2; // product | warranty_plan
  string sku_id = 3;
  string product_id = 4;
  string category_id = 5;
  string name = 6;
  bool serialized = 7;
  optional int32 parent_line_no = 8; // plans only: the covered device line
  optional int32 coverage_months = 9; // plans only
  int32 quantity = 10;
  int64 unit_price_cents = 11;
  int64 discount_cents = 12;
  int64 tax_cents = 13;
  int64 paid_cents = 14;
  int32 returned_qty = 15;
  int64 refunded_cents = 16;
}

message StatusChange {
  string from_status = 1; // empty on the first row
  string to_status = 2;
  string actor_type = 3; // customer | staff | system
  string actor_id = 4; // empty for the system
  string reason = 5;
  google.protobuf.Timestamp at = 6;
}

message OrderSummary {
  string id = 1;
  string number = 2;
  string kind = 3;
  string status = 4;
  int64 total_cents = 5;
  google.protobuf.Timestamp created_at = 6;
}

message GetOrderRequest {
  string order_id = 1;
}

message ListMyOrdersRequest {
  int32 page = 1;
  int32 page_size = 2;
}

message SearchOrdersRequest {
  optional string number = 1;
  optional string account_id = 2;
  optional string status = 3;
  int32 page = 4;
  int32 page_size = 5;
}

message ListOrdersResponse {
  repeated OrderSummary items = 1;
}

message CancelOrderRequest {
  string order_id = 1;
  int64 version = 2;
}

message SupportCancelOrderRequest {
  string order_id = 1;
  string reason = 2;
  int64 version = 3;
}
