syntax = "proto3";

package bloom.order.v1;

import "google/api/annotations.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Bloom.Order.Api";

// 03-order §9: the address of a checkout. The services of 03-order §5.1 join this file in their own tasks.
message ShipTo {
  string name = 1;
  repeated string lines = 2;
  string city = 3;
  string state = 4;
  string zip = 5;
  string phone = 6;
}

// 03-order §5.1, Cart API: customers only, transcoded to JSON under /api/cart (spec §6).
service OrderCart {
  // No cart is version 0 with no lines. Each line carries its current catalog price and flags (spec §4).
  rpc GetCart(GetCartRequest) returns (Cart) {
    option (google.api.http) = { get: "/api/cart" };
  }

  // `quantity` is absolute; 0 removes the line and, for a device, its plan lines. `version` must be the cart's (0 for no cart).
  rpc UpsertCartLine(UpsertCartLineRequest) returns (Cart) {
    option (google.api.http) = { put: "/api/cart/lines" body: "*" };
  }

  // A device line takes its plan lines with it. `version` travels as a query parameter.
  rpc RemoveCartLine(RemoveCartLineRequest) returns (Cart) {
    option (google.api.http) = { delete: "/api/cart/lines/{line_no}" };
  }
}

message GetCartRequest {}

message UpsertCartLineRequest {
  string kind = 1; // product | warranty_plan
  string sku_id = 2;
  optional int32 parent_line_no = 3; // plans only: the device line
  int32 quantity = 4;
  int64 version = 5;
}

message RemoveCartLineRequest {
  int32 line_no = 1;
  int64 version = 2;
}

message Cart {
  int64 version = 1;
  repeated CartLine lines = 2;
}

message CartLine {
  int32 line_no = 1;
  string kind = 2;
  string sku_id = 3;
  optional int32 parent_line_no = 4;
  int32 quantity = 5;
  string name = 6;
  optional int64 price_cents = 7; // current catalog price
  bool available = 8; // catalog `buyable`
  optional bool out_of_stock = 9; // product lines only; absent when inventory is unreachable
}

// 03-order §5.1, staff API: coupons (catalog manager, admin) under /api/admin/coupons and checkout settings (admin) under /api/admin/settings (spec §6).
service OrderStaff {
  // Newest first; `active` filters. `page` from 1 (0 is 1), `page_size` 1-100 (0 is 50).
  rpc ListCoupons(ListCouponsRequest) returns (ListCouponsResponse) {
    option (google.api.http) = { get: "/api/admin/coupons" };
  }

  // A code that exists ignoring case is COUPON_CODE_TAKEN.
  rpc CreateCoupon(CreateCouponRequest) returns (Coupon) {
    option (google.api.http) = { post: "/api/admin/coupons" body: "*" };
  }

  // Replaces every field but the code, and the scope items. Versioned; inactive coupons stay inactive.
  rpc UpdateCoupon(UpdateCouponRequest) returns (Coupon) {
    option (google.api.http) = { put: "/api/admin/coupons/{coupon_id}" body: "*" };
  }

  // Versioned (PRM-R13). An inactive coupon stays inactive.
  rpc DeactivateCoupon(DeactivateCouponRequest) returns (Coupon) {
    option (google.api.http) = { post: "/api/admin/coupons/{coupon_id}/deactivate" body: "*" };
  }

  rpc GetCheckoutSettings(GetCheckoutSettingsRequest) returns (CheckoutSettings) {
    option (google.api.http) = { get: "/api/admin/settings/checkout" };
  }

  // Versioned; `version` is the settings' (0 until the first change).
  rpc SetExpressFee(SetExpressFeeRequest) returns (CheckoutSettings) {
    option (google.api.http) = { put: "/api/admin/settings/checkout/express-fee" body: "*" };
  }
}

message ScopeItem {
  string target_type = 1; // product | category
  string target_id = 2;
}

message Coupon {
  string id = 1;
  string code = 2; // as entered
  string type = 3; // percent | fixed
  int32 value = 4; // percent 1-100, fixed cents > 0
  string scope = 5; // order | selected
  repeated ScopeItem scope_items = 6;
  optional int64 min_spend_cents = 7;
  google.protobuf.Timestamp starts_at = 8;
  google.protobuf.Timestamp expires_at = 9;
  optional int32 total_limit = 10;
  optional int32 per_customer_limit = 11;
  int32 uses_count = 12;
  bool active = 13;
  int64 version = 14;
  google.protobuf.Timestamp created_at = 15;
}

message CreateCouponRequest {
  string code = 1;
  string type = 2;
  int32 value = 3;
  string scope = 4;
  repeated ScopeItem scope_items = 5;
  optional int64 min_spend_cents = 6;
  google.protobuf.Timestamp starts_at = 7;
  google.protobuf.Timestamp expires_at = 8;
  optional int32 total_limit = 9;
  optional int32 per_customer_limit = 10;
}

message UpdateCouponRequest {
  string coupon_id = 1;
  int64 version = 2;
  string type = 3;
  int32 value = 4;
  string scope = 5;
  repeated ScopeItem scope_items = 6;
  optional int64 min_spend_cents = 7;
  google.protobuf.Timestamp starts_at = 8;
  google.protobuf.Timestamp expires_at = 9;
  optional int32 total_limit = 10;
  optional int32 per_customer_limit = 11;
}

message DeactivateCouponRequest {
  string coupon_id = 1;
  int64 version = 2;
}

message ListCouponsRequest {
  optional bool active = 1;
  int32 page = 2;
  int32 page_size = 3;
}

message ListCouponsResponse {
  repeated Coupon items = 1;
}

message CheckoutSettings {
  int64 express_fee_cents = 1;
  int64 version = 2;
  string updated_by = 3;
  google.protobuf.Timestamp updated_at = 4;
}

message GetCheckoutSettingsRequest {}

message SetExpressFeeRequest {
  int64 express_fee_cents = 1;
  int64 version = 2;
}
