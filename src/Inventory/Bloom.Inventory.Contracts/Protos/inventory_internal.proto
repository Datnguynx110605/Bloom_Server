syntax = "proto3";

package bloom.inventory.v1;

import "google/protobuf/empty.proto";

option csharp_namespace = "Bloom.Inventory.Contracts";

// 02-inventory §5.1: internal APIs for order (ReserveStock, GetAvailability) and fulfillment (CommitForReship, packing serials). Not routed by the gateway.
service InventoryStock {
  // Idempotent by order_id: the same lines again is ok, other lines are RESERVATION_CONFLICT. All lines or none; SOLD_OUT carries metadata skuId.
  rpc ReserveStock(ReserveStockRequest) returns (google.protobuf.Empty);
  rpc GetAvailability(GetAvailabilityRequest) returns (GetAvailabilityResponse);
  // Idempotent by reship_id, like ReserveStock.
  rpc CommitForReship(CommitForReshipRequest) returns (google.protobuf.Empty);
}

service InventoryPacking {
  rpc AssignSerial(AssignSerialRequest) returns (google.protobuf.Empty);
  rpc UnassignSerial(UnassignSerialRequest) returns (google.protobuf.Empty);
  rpc ReplaceSerial(ReplaceSerialRequest) returns (google.protobuf.Empty);
}

message StockLine {
  string sku_id = 1;
  int32 quantity = 2;
}

message ReserveStockRequest {
  string order_id = 1;
  repeated StockLine lines = 2;
}

message GetAvailabilityRequest {
  repeated string sku_ids = 1;
}

// One item per distinct requested id, in request order. A SKU never received has available = 0.
message GetAvailabilityResponse {
  repeated SkuAvailability items = 1;
}

message SkuAvailability {
  string sku_id = 1;
  int32 available = 2;
}

message CommitForReshipRequest {
  string reship_id = 1;
  string order_id = 2;
  repeated StockLine lines = 3;
}

message AssignSerialRequest {
  string ref_id = 1;
  string sku_id = 2;
  string serial = 3;
}

message UnassignSerialRequest {
  string ref_id = 1;
  string serial = 2;
}

message ReplaceSerialRequest {
  string ref_id = 1;
  string old_serial = 2;
  string new_serial = 3;
}
