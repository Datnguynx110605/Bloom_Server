syntax = "proto3";

package bloom.inventory.v1;

import "google/api/annotations.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Bloom.Inventory.V1";

// 02-inventory §5.1, Warehouse API: staff only, transcoded to JSON under /api/admin/inventory.
service InventoryWarehouse {
  // warehouse, admin. Requires an Idempotency-Key header.
  rpc RecordGoodsReceipt(RecordGoodsReceiptRequest) returns (RecordGoodsReceiptResponse) {
    option (google.api.http) = { post: "/api/admin/inventory/receipts" body: "*" };
  }

  // warehouse, admin. Requires an Idempotency-Key header.
  rpc AdjustStock(AdjustStockRequest) returns (AdjustStockResponse) {
    option (google.api.http) = { post: "/api/admin/inventory/adjustments" body: "*" };
  }

  // warehouse, catalog_manager, support, admin. Filters AND together; ordered by sku_id.
  rpc ListStockLevels(ListStockLevelsRequest) returns (ListStockLevelsResponse) {
    option (google.api.http) = { get: "/api/admin/inventory/stock" };
  }

  // warehouse, admin. Newest first by (created_at, id); an unknown SKU gives an empty page.
  rpc GetLedger(GetLedgerRequest) returns (GetLedgerResponse) {
    option (google.api.http) = { get: "/api/admin/inventory/ledger/{sku_id}" };
  }

  // warehouse, support, admin. The serial is trimmed and upper-cased; unknown is NOT_FOUND.
  rpc GetSerial(GetSerialRequest) returns (SerialUnitView) {
    option (google.api.http) = { get: "/api/admin/inventory/serials/{serial}" };
  }
}

message RecordGoodsReceiptRequest {
  string note = 1;
  repeated ReceiptLine lines = 2;
}

// `imeis[i]` belongs to `serials[i]`; `imeis` is empty or as long as `serials`.
message ReceiptLine {
  string sku_id = 1;
  int32 quantity = 2;
  repeated string serials = 3;
  repeated string imeis = 4;
}

message RecordGoodsReceiptResponse {
  string receipt_id = 1;
}

// 02-inventory §6.8 and spec §4. A serialized SKU adjusts one unit per call (delta = -1 or +1):
// decrease names an in_stock `serial`; increase names a lost `serial` or one entry of `new_serials` (with its parallel `new_imeis`).
message AdjustStockRequest {
  string sku_id = 1;
  int32 delta = 2;
  string reason_code = 3;
  string note = 4;
  string serial = 5;
  repeated string new_serials = 6;
  repeated string new_imeis = 7;
}

message AdjustStockResponse {
  string adjustment_id = 1;
}

// `page` 0 = 1; `page_size` 0 = 50, 1 to 100. `available_at_most` >= 0 (0 = sold out).
message ListStockLevelsRequest {
  optional string product_id = 1;
  repeated string sku_ids = 2;
  optional int32 available_at_most = 3;
  optional bool has_backorders = 4;
  int32 page = 5;
  int32 page_size = 6;
}

message ListStockLevelsResponse {
  repeated StockLevel items = 1;
}

// `backordered` is the sum of the SKU's `backordered` allocation quantities.
message StockLevel {
  string sku_id = 1;
  string product_id = 2;
  bool serialized = 3;
  int32 on_hand = 4;
  int32 reserved = 5;
  int32 available = 6;
  int32 committed = 7;
  int32 returned = 8;
  int32 damaged = 9;
  int32 lost = 10;
  int32 backordered = 11;
  google.protobuf.Timestamp updated_at = 12;
}

// `from` inclusive, `to` exclusive; both optional.
message GetLedgerRequest {
  string sku_id = 1;
  google.protobuf.Timestamp from = 2;
  google.protobuf.Timestamp to = 3;
  int32 page = 4;
  int32 page_size = 5;
}

message GetLedgerResponse {
  repeated LedgerEntry entries = 1;
}

// One `stock_ledger` row (02-inventory §4.6).
message LedgerEntry {
  string id = 1;
  string sku_id = 2;
  string entry_type = 3;
  int32 d_on_hand = 4;
  int32 d_reserved = 5;
  int32 d_committed = 6;
  int32 d_returned = 7;
  int32 d_damaged = 8;
  int32 d_lost = 9;
  string ref_type = 10;
  string ref_id = 11;
  string actor = 12;
  google.protobuf.Timestamp created_at = 13;
}

message GetSerialRequest {
  string serial = 1;
}

// `imei` and `ref_id` are empty when the unit has none.
message SerialUnitView {
  string serial = 1;
  string imei = 2;
  string sku_id = 3;
  string status = 4;
  string ref_id = 5;
  string receipt_id = 6;
  google.protobuf.Timestamp updated_at = 7;
}
