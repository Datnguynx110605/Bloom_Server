syntax = "proto3";

package bloom.identity.v1;

import "google/api/annotations.proto";
import "google/protobuf/empty.proto";

option csharp_namespace = "Bloom.Identity.V1";

// 06-identity §5.1.
service Account {
  rpc GetMe(google.protobuf.Empty) returns (GetMeResponse) {
    option (google.api.http) = { get: "/api/me/profile" };
  }
  rpc ChangeEmail(ChangeEmailRequest) returns (google.protobuf.Empty) {
    option (google.api.http) = { post: "/api/me/email" body: "*" };
  }
  rpc ConfirmEmailChange(ConfirmEmailChangeRequest) returns (google.protobuf.Empty) {
    option (google.api.http) = { post: "/api/me/email/confirm" body: "*" };
  }
  rpc ChangePassword(ChangePasswordRequest) returns (google.protobuf.Empty) {
    option (google.api.http) = { post: "/api/me/password" body: "*" };
  }
  rpc LinkGoogle(LinkGoogleRequest) returns (google.protobuf.Empty) {
    option (google.api.http) = { post: "/api/me/google" body: "*" };
  }
  rpc UnlinkGoogle(google.protobuf.Empty) returns (google.protobuf.Empty) {
    option (google.api.http) = { delete: "/api/me/google" };
  }
  rpc ListAddresses(google.protobuf.Empty) returns (ListAddressesResponse) {
    option (google.api.http) = { get: "/api/me/addresses" };
  }
  rpc UpsertAddress(Address) returns (Address) {
    option (google.api.http) = { put: "/api/me/addresses" body: "*" };
  }
  rpc DeleteAddress(DeleteAddressRequest) returns (google.protobuf.Empty) {
    option (google.api.http) = { delete: "/api/me/addresses/{id}" };
  }
  rpc DeleteAccount(google.protobuf.Empty) returns (google.protobuf.Empty) {
    option (google.api.http) = { delete: "/api/me/account" };
  }
}

message GetMeResponse {
  string account_id = 1;
  string type = 2;
  string email = 3;
  string name = 4;
  optional string role = 5; // staff only
  bool google_linked = 6;
  bool has_password = 7;
}

message ChangeEmailRequest {
  string new_email = 1;
}

message ConfirmEmailChangeRequest {
  string code = 1;
}

message ChangePasswordRequest {
  string current_password = 1;
  string new_password = 2;
}

message LinkGoogleRequest {
  string id_token = 1;
}

// Empty id on UpsertAddress creates; id + version updates (spec §6).
message Address {
  string id = 1;
  int64 version = 2;
  string label = 3;
  string recipient = 4;
  string line1 = 5;
  string line2 = 6;
  string city = 7;
  string state = 8;
  string zip = 9;
  string phone = 10;
  bool is_default = 11;
}

message ListAddressesResponse {
  repeated Address addresses = 1;
}

message DeleteAddressRequest {
  string id = 1;
}
