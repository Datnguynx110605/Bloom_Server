syntax = "proto3";

package bloom.identity.v1;

import "google/api/annotations.proto";
import "google/protobuf/empty.proto";

option csharp_namespace = "Bloom.Identity.V1";

// 06-identity §5.1. Token-issuing methods return TokenResponse and set the bloom_rt cookie.
service Auth {
  rpc StartSignUp(StartSignUpRequest) returns (google.protobuf.Empty) {
    option (google.api.http) = { post: "/api/auth/sign-up/start" body: "*" };
  }
  rpc VerifySignUpCode(VerifySignUpCodeRequest) returns (VerifySignUpCodeResponse) {
    option (google.api.http) = { post: "/api/auth/sign-up/verify" body: "*" };
  }
  rpc CompleteSignUp(CompleteSignUpRequest) returns (TokenResponse) {
    option (google.api.http) = { post: "/api/auth/sign-up/complete" body: "*" };
  }
  rpc SignIn(SignInRequest) returns (SignInResponse) {
    option (google.api.http) = { post: "/api/auth/sign-in" body: "*" };
  }
  rpc SignInWithGoogle(SignInWithGoogleRequest) returns (TokenResponse) {
    option (google.api.http) = { post: "/api/auth/google" body: "*" };
  }
  rpc RequestPasswordReset(RequestPasswordResetRequest) returns (google.protobuf.Empty) {
    option (google.api.http) = { post: "/api/auth/password-reset/request" body: "*" };
  }
  rpc ResetPassword(ResetPasswordRequest) returns (google.protobuf.Empty) {
    option (google.api.http) = { post: "/api/auth/password-reset/confirm" body: "*" };
  }
  rpc Refresh(google.protobuf.Empty) returns (TokenResponse) {
    option (google.api.http) = { post: "/auth/refresh" };
  }
  rpc SignOut(SignOutRequest) returns (google.protobuf.Empty) {
    option (google.api.http) = { post: "/api/me/sign-out" body: "*" };
  }
  rpc SignOutEverywhere(google.protobuf.Empty) returns (google.protobuf.Empty) {
    option (google.api.http) = { post: "/api/me/sign-out-everywhere" };
  }
}

message StartSignUpRequest {
  string email = 1;
}

message VerifySignUpCodeRequest {
  string email = 1;
  string code = 2;
}

message VerifySignUpCodeResponse {
  string registration_token = 1;
}

message CompleteSignUpRequest {
  string registration_token = 1;
  string password = 2;
  string name = 3;
}

message SignInRequest {
  string email = 1;
  string password = 2;
}

// Customers get an access token (and the cookie); staff get an MFA challenge instead.
message SignInResponse {
  oneof result {
    string access_token = 1;
    string mfa_challenge_id = 2;
  }
}

message SignInWithGoogleRequest {
  string id_token = 1;
}

message RequestPasswordResetRequest {
  string email = 1;
}

message ResetPasswordRequest {
  string email = 1;
  string code = 2;
  string new_password = 3;
}

message SignOutRequest {
  string sid = 1;
}

message TokenResponse {
  string access_token = 1;
}
