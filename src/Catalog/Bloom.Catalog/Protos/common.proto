syntax = "proto3";

package bloom.catalog.v1;

option csharp_namespace = "Bloom.Catalog.V1";

// 08-catalog §4.1. Top level categories carry their sub-categories in `children` (CAT-R01).
message Category {
  string id = 1;
  string parent_id = 2; // empty = top level
  string name = 3;
  string slug = 4;
  int32 sort_order = 5;
  int64 version = 6;
  repeated Category children = 7;
}

// Product specs (08-catalog §4.1 `specs`): display-only groups of label/value pairs.
message SpecItem {
  string label = 1;
  string value = 2;
}

message SpecGroup {
  string group = 1;
  repeated SpecItem items = 2;
}

message OptionValue {
  string id = 1;
  string value = 2;
  int32 position = 3;
}

message OptionType {
  string id = 1;
  string name = 2;
  int32 position = 3;
  repeated OptionValue values = 4;
}

message Image {
  string id = 1;
  string url = 2;
  string alt_text = 3;
  string sku_id = 4; // empty = the whole product
  int32 position = 5;
  string status = 6; // pending | ready
}
