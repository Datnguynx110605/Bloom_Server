syntax = "proto3";

package bloom.catalog.v1;

import "google/api/annotations.proto";
import "google/protobuf/empty.proto";
import "Protos/common.proto";

option csharp_namespace = "Bloom.Catalog.V1";

// 08-catalog §5, customers only. One review per product (REV-R03); the author name is never taken from the request.
service CatalogCustomer {
  // Without `version`: create (a verified buyer of a publicly visible product; a second review → CONCURRENCY_CONFLICT).
  // With `version`: edit the caller's own review with optimistic locking (no review → NOT_FOUND, stale → CONCURRENCY_CONFLICT).
  rpc UpsertMyReview(UpsertMyReviewRequest) returns (Review) {
    option (google.api.http) = { put: "/api/reviews/{product_id}" body: "*" };
  }
  // The caller's own review, whatever its status or the product's.
  rpc DeleteMyReview(DeleteMyReviewRequest) returns (google.protobuf.Empty) {
    option (google.api.http) = { delete: "/api/reviews/{product_id}" };
  }
}

// `rating` 1 to 5; `text` at most 2,000 characters (blank = none).
message UpsertMyReviewRequest {
  string product_id = 1;
  int32 rating = 2;
  string text = 3;
  optional int64 version = 4;
}

message DeleteMyReviewRequest {
  string product_id = 1;
}
