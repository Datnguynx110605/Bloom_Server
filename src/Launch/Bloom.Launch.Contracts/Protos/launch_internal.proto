syntax = "proto3";

package bloom.launch.v1;

option csharp_namespace = "Bloom.Launch.Contracts";

// 01-launch §5.1: internal API for order.
service LaunchInternal {
  rpc HoldAllocation(HoldAllocationRequest) returns (HoldAllocationResponse);
}

message HoldAllocationRequest {
  string order_id = 1;
  string pass_token = 2;
  repeated HoldLine lines = 3;
}

message HoldLine {
  string sku_id = 1;
  int32 quantity = 2;
}

message HoldAllocationResponse {
  string hold_id = 1;
  repeated HoldLine lines = 2;
}
